[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "admet-gnn-benchmark"
version = "0.1.0"
description = "Reproducible ADMET benchmark comparing fingerprint baselines and a small GNN."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
